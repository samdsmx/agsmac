name: Optimize images

# Comprime y redimensiona las imágenes nuevas o modificadas en cada
# pull request que toque la carpeta images/. Usa calibreapp/image-actions,
# que publica un comentario con el diff de tamaños y compromete los
# cambios optimizados al branch del PR.
#
# Nota: calibreapp/image-actions sólo soporta el evento `pull_request`
# (en push falla con "This action only runs for pushes to PRs"). Para
# optimizar antes de mergear a main, abre un PR o corre localmente
# `npm run optimize-images:write`.

on:
  pull_request:
    paths:
      - 'images/**'
      - '.github/workflows/optimize-images.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    # Evita correr el job en PRs desde forks (no tiene permisos para
    # commitear de vuelta).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compress Images
        uses: calibreapp/image-actions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Calidad para JPEG (mozjpeg) y compresión sin pérdida para PNG.
          jpegQuality: '80'
          jpegProgressive: true
          pngQuality: '80'
          webpQuality: '80'
          # No procesar las copias originales que el script local crea.
          ignorePaths: 'images/_originals/**,node_modules/**'
